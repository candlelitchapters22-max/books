<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ✏️ CHANGE 1: the name shown on the browser tab -->
<title>My Reading Nook</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,500;1,600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ✏️ CHANGE 2: COLORS. Change any code after the # to try a new color. */
:root{
  --dark:   #6C5B9E;   /* deep purple */
  --medium: #A797DB;   /* medium lavender */
  --light:  #CFC3EE;   /* light lavender */
  --pale:   #D3C8EC;   /* PAGE BACKGROUND: plain lavender (a bit darker) */
  --pink:   #F9D1E3;   /* soft pink */
  --text:   #2f2450;   /* text color */
  --title:  #3f2f6e;   /* DARK purple for the title and headings. Darker code = darker text */
  --quote:  #2f2450;   /* DARK purple for the quotes */

  /* ✏️ CHANGE 8: SIZES. Change the numbers, save, then press F5 in Chrome. */
  --strip-width: 150px;           /* WIDTH of the 3 still pictures on the left edge */
  --girl-width:  min(20vw,270px); /* SIZE of the girl in the bottom right corner */
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; min-height:100vh; overflow-x:hidden;
  font-family:Nunito,sans-serif; color:var(--text);
  background:var(--pale);
}
@keyframes fadein{from{opacity:0; transform:translateY(18px)}to{opacity:1; transform:none}}
@keyframes float{50%{transform:translateY(-14px) rotate(6deg)}}
@keyframes drift{50%{transform:translate(20px,-12px) rotate(-9deg)}}
@keyframes twinkle{50%{transform:scale(1.35) rotate(15deg); opacity:.45}}
@keyframes sway{50%{transform:rotate(2.5deg) translateY(-6px)}}

/* ---------- DOODLES (they move) ---------- */
.doodles{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden}
.d{position:absolute; fill:none; stroke:currentColor; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round}
.d.float  {animation:float 7s ease-in-out infinite}
.d.drift  {animation:drift 11s ease-in-out infinite}
.d.twinkle{animation:twinkle 3.5s ease-in-out infinite}
.d.big{width:64px; height:64px}
.d.mid{width:46px; height:46px}
.d.small{width:30px; height:30px}

/* ---------- PICTURES THAT STAY ---------- */
.strip{position:fixed; left:0; top:0; bottom:0; width:var(--strip-width); display:grid; grid-template-rows:repeat(3,1fr); z-index:2}
.tile{position:relative; overflow:hidden; background:var(--light)}
.tile img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.char{position:fixed; right:0; bottom:0; width:var(--girl-width); mix-blend-mode:multiply; z-index:2; pointer-events:none; transform-origin:bottom center; animation:sway 6s ease-in-out infinite}

/* ---------- PAGE LAYOUT ---------- */
.stage{
  position:relative; z-index:3; min-height:100vh; display:grid; grid-template-columns:1fr;
  align-items:center; padding:2rem 2rem 2rem var(--strip-width); animation:fadein .9s both;
}
.login{justify-self:center; width:min(520px,100%)}
h1{font-family:'Cormorant Garamond',serif; font-size:clamp(1.9rem,3.6vw,3rem); line-height:1.05; margin:0; color:var(--title); white-space:nowrap}
.quote{font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:600; font-size:1.2rem; line-height:1.35; color:var(--quote); margin:.5rem 0 1.4rem; min-height:6.2em; transition:opacity .6s}
.quote.fade{opacity:0}
h2{font-family:'Cormorant Garamond',serif; font-size:2rem; margin:0 0 .8rem; color:var(--title)}
form{display:grid; gap:.9rem}
input,select{width:100%; padding:.9rem 1rem; font:inherit; border:1.5px solid transparent; border-radius:12px; background:#fff; transition:box-shadow .2s,border-color .2s}
input:focus,select:focus{outline:none; border-color:var(--medium); box-shadow:0 0 0 4px rgba(167,151,219,.35)}
button{padding:.9rem; font:inherit; font-weight:700; border-radius:999px; cursor:pointer; border:1.5px solid transparent; background:#fff; color:var(--dark); transition:transform .2s,box-shadow .2s}
button:hover{transform:translateY(-2px); box-shadow:0 8px 16px rgba(108,91,158,.25)}
button.main{background:linear-gradient(135deg,var(--dark),var(--medium)); color:#fff}
.linkbtn{background:none; border:none; box-shadow:none; color:var(--title); text-decoration:underline; padding:.2rem; font-weight:600}
.linkbtn:hover{box-shadow:none; transform:none}
.note{min-height:1.4em; margin:.8rem 0 0; font-size:.92rem; color:#9b3d70}

/* ---------- THE BOOKS SCREEN (after login) ---------- */
.appbox{justify-self:center; width:min(860px,100%)}
.apphead{display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap; margin-bottom:1rem}
.apphead h2{margin:.2rem 0 0; font-size:1.6rem}
.panel{background:rgba(255,255,255,.78); border:1px solid var(--light); border-radius:16px; padding:1.2rem; margin-bottom:1rem; box-shadow:0 12px 30px -18px rgba(108,91,158,.5)}
.panel h3{font-family:'Cormorant Garamond',serif; font-size:1.6rem; margin:0 0 .8rem; color:var(--title)}
.panel input,.panel select{border-color:var(--light)}
.fields{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:.7rem; margin-bottom:.9rem}
label{display:grid; gap:.25rem; font-size:.85rem; font-weight:700; color:var(--title)}
.row{display:flex; gap:.6rem; flex-wrap:wrap}
button.small{padding:.4rem 1rem; font-size:.88rem; border-color:var(--light)}
button.danger{color:#b0457a}
.count{color:var(--title); font-weight:700; margin:0 0 .6rem}
.bk{display:flex; justify-content:space-between; gap:1rem; align-items:center; padding:.8rem 0; border-top:1px solid var(--light)}
.bk h4{margin:0; font:700 1.25rem 'Cormorant Garamond',serif; color:var(--title)}
.bk .meta{font-size:.9rem; color:#6f6394}
.tag{display:inline-block; padding:0 .6rem; border-radius:99px; background:var(--pale); font-size:.78rem; margin-right:.3rem; color:var(--title)}
.tag.Completed{background:#d8efe0}.tag.Reading{background:var(--pink)}
.stars{color:var(--dark); letter-spacing:1px}
.empty{color:#6f6394; text-align:center; padding:1rem}
@media(max-width:760px){
  .strip,.char,.hide-small{display:none}
  .stage{padding:1.2rem}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>

<body>

<!-- ✏️ CHANGE 3: DOODLES. Each line is one drawing.
     use href="#book" = which drawing:
        book, stack, bookmark, glasses, quill, cup, candle, pencil, leaf, star, heart, sparkle, moon

<!-- THREE PICTURES ON THE LEFT EDGE (they stay still) -->
<div class="strip" aria-hidden="true">
  <div class="tile" id="tile0"></div>
  <div class="tile" id="tile1"></div>

<main class="stage">
  <div class="login" id="loginBox">
    <!-- ✏️ CHANGE 4: the big title -->

<script>
/* ✏️ CHANGE 7: YOUR PICTURES.
   Write the picture names WITHOUT the ending (no .jpg, .jpeg, .png).
   The page finds the right ending by itself.
   Example: a file called pic1.jpg is written as  "images/pic1"
   The last name in a list has no comma. */

// The 3 pictures on the left edge that STAY STILL, from top to bottom
const stripPictures = ["images/pic11", "images/pic10", "images/pic9"];

// The girl in the bottom right corner (she sways a little)
const character = "images/pic8";


/* ✏️ CHANGE 9: YOUR QUOTES. They appear one after another under the title.
   Each quote goes inside "quote marks", with a comma at the end.
   The last one has no comma. Add as many as you like. */
const quotes = [
  "Every book you finish becomes part of you.",
  "She read books as one breathes air, to fill up and live",
  "I declare after all there is no enjoyment like reading! How much sooner one tires of any thing than of a book! — When I have a house of my own, I shall be miserable if I have not an excellent library"
];

// How fast the quotes change. 8000 = 8 seconds.
const quoteSpeed = 8000;


/* ---- you do not need to change anything below this line ---- */
const endings = [".jpeg", ".jpg", ".png", ".webp", ".jfif", ".gif", ".JPG", ".JPEG", ".PNG"];

function loadAny(base, done, i){
  i = i || 0;
  if (i >= endings.length) return;           // no file found: skip it
  const img = new Image();
  img.alt = "";
  img.onload = function(){ done(img); };
  img.onerror = function(){ loadAny(base, done, i + 1); };
  img.src = base + endings[i];
}

// the still pictures on the left edge
stripPictures.forEach(function(base, i){
  loadAny(base, function(img){
    document.getElementById("tile" + i).appendChild(img);
  });
});

// the girl in the corner
loadAny(character, function(img){
  img.className = "char";
  document.body.appendChild(img);
});

// the quotes
(function(){
  const p = document.getElementById("quoteText");
  let q = 0;
  setInterval(function(){
    p.classList.add("fade");
    setTimeout(function(){
      q = (q + 1) % quotes.length;
      p.textContent = quotes[q];
      p.classList.remove("fade");
    }, 600);
  }, quoteSpeed);
})();

</script>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,addDoc,updateDoc,deleteDoc,doc,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,sendPasswordResetEmail,updateProfile} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ✏️ CHANGE 10: YOUR FIREBASE SETTINGS (already filled in for you). */
const firebaseConfig = {
  apiKey: "AIzaSyDjs_9C_XzAOgEU8Idunna7pPULT9AaJjE",
  authDomain: "my-complete-book-tracker.firebaseapp.com",
  projectId: "my-complete-book-tracker",
  storageBucket: "my-complete-book-tracker.firebasestorage.app",
  messagingSenderId: "883912096588",
  appId: "1:883912096588:web:b8ce23ae9f7a0ce1d42de9"
};

/* ---- you do not need to change anything below this line ---- */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = function(id){ return document.getElementById(id); };
const say = function(text){ $("note").textContent = text; };

const messages = {
  "auth/invalid-credential": "Wrong email or password.",
  "auth/user-not-found": "No account with this email. Click Create account first.",
  "auth/wrong-password": "Wrong email or password.",
  "auth/email-already-in-use": "This email already has an account. Click Log in instead.",
  "auth/weak-password": "Password needs at least 6 characters.",
  "auth/invalid-email": "That email address does not look right.",
  "auth/missing-password": "Please type your password.",
  "auth/too-many-requests": "Too many tries. Please wait a few minutes and try again.",
  "auth/network-request-failed": "No internet connection. Please try again.",
  "auth/operation-not-allowed": "Email login is not turned on in Firebase, or new accounts are switched off."
};
function friendly(err){ return messages[err.code] || ("Something went wrong: " + err.code); }

// Login only works when the page is online, not when double-clicked from your computer
function onlineCheck(){
  if (location.protocol === "file:"){
    say("Login works only when the page is online. Follow the 'put it online' steps first.");
    return false;
  }
  return true;
}

// Shows "Welcome, <your User ID>" (or the start of your email if no User ID was saved)
function showHello(user){
  if (!user) return;
  $("hello").textContent = "Welcome, " + (user.displayName || user.email.split("@")[0]);
}

// Saves the User ID you typed, so it is remembered every time you log in
async function saveName(){
  const name = $("nameInput").value.trim();
  const user = auth.currentUser;
  if (user && name && name !== user.displayName){
    await updateProfile(user, {displayName: name});
  }
  showHello(user);
}

$("loginForm").addEventListener("submit", async function(e){
  e.preventDefault(); say("");
  if (!onlineCheck()) return;
  try {
    await signInWithEmailAndPassword(auth, $("email").value, $("password").value);
    await saveName();   // if you typed a User ID, remember it
  } catch (err) { say(friendly(err)); }
});

$("signupBtn").addEventListener("click", async function(){
  say("");
  if (!onlineCheck()) return;
  if (!$("email").value || !$("password").value){ say("Type your email and a password first."); return; }
  try {
    await createUserWithEmailAndPassword(auth, $("email").value, $("password").value);
    await saveName();   // save the User ID you typed
  } catch (err) { say(friendly(err)); }
});

$("resetBtn").addEventListener("click", async function(){
  say("");
  if (!onlineCheck()) return;
  if (!$("email").value){ say("Type your email first, then click Forgot password."); return; }
  try { await sendPasswordResetEmail(auth, $("email").value); say("Reset email sent. Check your inbox and spam folder."); }
  catch (err) { say(friendly(err)); }
});

$("logoutBtn").addEventListener("click", function(){ signOut(auth); });

/* ---------- YOUR BOOKS ---------- */
let col = null, unsub = null, books = [], editId = null;
const esc = function(t){ return String(t == null ? "" : t).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };

// Loads your books automatically and keeps the list up to date
function startLoading(user){
  stopLoading();
  col = collection(db, "users", user.uid, "books");
  unsub = onSnapshot(col, function(snap){
    books = snap.docs.map(function(d){ return Object.assign({id: d.id}, d.data()); });
    drawList();
  }, function(err){ $("formNote").textContent = "Could not load your books: " + err.message; });
}
function stopLoading(){
  if (unsub){ unsub(); unsub = null; }
  books = []; col = null; drawList();
}

function stars(r){
  if (!r) return "";
  return '<span class="stars">' + "★".repeat(Math.floor(r)) + (r % 1 ? "½" : "") + ' <small>' + r + '</small></span>';
}

function drawList(){
  const sorted = books.slice().sort(function(a, b){
    return ((b.added && b.added.seconds) || 9e9) - ((a.added && a.added.seconds) || 9e9);
  });
  const done = books.filter(function(b){ return b.status === "Completed"; }).length;
  $("count").textContent = books.length + (books.length === 1 ? " book" : " books") + " · " + done + " completed";
  $("list").innerHTML = sorted.length ? sorted.map(function(b){
    return '<div class="bk"><div>' +
      '<h4>' + esc(b.title) + '</h4>' +
      '<div class="meta">' + esc(b.author || "Unknown author") + (b.pages ? " · " + esc(b.pages) + " pages" : "") + '</div>' +
      '<div><span class="tag ' + esc(b.status) + '">' + esc(b.status) + '</span>' +
        (b.language ? '<span class="tag">' + esc(b.language) + '</span>' : "") + stars(b.rating) + '</div>' +
      '</div><div class="row">' +
      '<button class="small" data-act="edit" data-id="' + b.id + '">Edit</button>' +
      '<button class="small danger" data-act="del" data-id="' + b.id + '">Delete</button>' +
      '</div></div>';
  }).join("") : '<p class="empty">No books yet. Add your first one above.</p>';
}

function clearForm(){
  editId = null;
  $("bookForm").reset();
  $("formTitle").textContent = "Add a book";
  $("saveBtn").textContent = "Add book";
  $("cancelBtn").hidden = true;
}
$("cancelBtn").addEventListener("click", clearForm);

$("bookForm").addEventListener("submit", async function(e){
  e.preventDefault();
  $("formNote").textContent = "";
  const data = {
    title: $("b_title").value.trim(),
    author: $("b_author").value.trim(),
    language: $("b_language").value,
    status: $("b_status").value,
    pages: $("b_pages").value === "" ? "" : Number($("b_pages").value),
    rating: $("b_rating").value === "" ? "" : Number($("b_rating").value)
  };
  try {
    if (editId){ await updateDoc(doc(col, editId), data); }
    else { data.added = serverTimestamp(); await addDoc(col, data); }
    clearForm();
  } catch (err) { $("formNote").textContent = "Could not save: " + err.message; }
});

$("list").addEventListener("click", async function(e){
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const b = books.find(function(x){ return x.id === btn.dataset.id; });
  if (!b) return;
  if (btn.dataset.act === "del"){
    if (confirm('Delete "' + b.title + '"?')) await deleteDoc(doc(col, b.id));
  } else {
    editId = b.id;
    $("b_title").value = b.title || "";
    $("b_author").value = b.author || "";
    $("b_language").value = b.language || "";
    $("b_status").value = b.status || "To Be Read";
    $("b_pages").value = b.pages === undefined ? "" : b.pages;
    $("b_rating").value = b.rating === undefined ? "" : b.rating;
    $("formTitle").textContent = "Edit book";
    $("saveBtn").textContent = "Save changes";
    $("cancelBtn").hidden = false;
    $("bookForm").scrollIntoView({behavior: "smooth", block: "center"});
  }
});

// Runs when the page opens, and every time you log in or out
onAuthStateChanged(auth, function(user){
  $("loginBox").hidden = !!user;
  $("welcomeBox").hidden = !user;
  if (user){
    showHello(user);
    $("password").value = "";
    startLoading(user);
  } else {
    stopLoading();
  }
});
</script>
</body>
</html>
